<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant - Demo</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .demo-info {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem 0;
            text-align: center;
        }
        
        .demo-info h3 {
            color: #667eea;
            margin-bottom: 0.5rem;
        }
        
        .demo-info p {
            color: #666;
            margin-bottom: 0.5rem;
        }
        
        .demo-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        
        .demo-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .demo-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .demo-btn.secondary {
            background: #6c757d;
        }
        
        .demo-btn.secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-robot"></i>
                <h1>AI Chat Assistant - Demo</h1>
            </div>
            <div class="header-actions">
                <button class="clear-btn" onclick="clearChat()">
                    <i class="fas fa-trash"></i>
                    Clear Chat
                </button>
            </div>
        </header>

        <!-- Demo Info -->
        <div class="demo-info">
            <h3>🚀 Demo Mode Active</h3>
            <p>This is a demonstration of the AI Chat Assistant. Try asking questions or use the demo buttons below!</p>
            <div class="demo-buttons">
                <button class="demo-btn" onclick="sendDemoMessage('Hello, how are you?')">
                    <i class="fas fa-hand-wave"></i> Say Hello
                </button>
                <button class="demo-btn" onclick="sendDemoMessage('Can you help me with a coding problem?')">
                    <i class="fas fa-code"></i> Coding Help
                </button>
                <button class="demo-btn" onclick="sendDemoMessage('Tell me a joke')">
                    <i class="fas fa-laugh"></i> Tell a Joke
                </button>
                <button class="demo-btn secondary" onclick="window.open('index.html', '_blank')">
                    <i class="fas fa-external-link-alt"></i> Full App
                </button>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <div class="welcome-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <h2>Welcome to AI Chat Assistant</h2>
                <p>This is a demo version with mock responses. Use the buttons above to try different conversation starters!</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    id="userInput" 
                    placeholder="Type your message here or use the demo buttons above..."
                    rows="1"
                    onkeydown="handleKeyPress(event)"
                ></textarea>
                <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="input-footer">
                <span class="typing-indicator" id="typingIndicator" style="display: none;">
                    <i class="fas fa-circle"></i>
                    <i class="fas fa-circle"></i>
                    <i class="fas fa-circle"></i>
                </span>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        // Demo-specific functions
        function sendDemoMessage(message) {
            if (chatApp) {
                chatApp.userInput.value = message;
                chatApp.sendMessage();
            }
        }
        
        // Override config for demo
        window.CONFIG = {
            ...window.CONFIG,
            API: {
                ENDPOINT: 'DEMO_MODE',
                API_KEY: 'DEMO_MODE',
                MAX_TOKENS: 1000,
                TEMPERATURE: 0.7,
                MODEL: 'demo-model'
            }
        };
    </script>
</body>
</html>
